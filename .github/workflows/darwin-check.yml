name: darwin-check

# Native validation for macOS Apple Silicon (M-series, macos-14 = arm64).
# This is the authoritative gate for macOS support: gpui's macOS backend
# builds and runs here without any cross-compilation tricks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
