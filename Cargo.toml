[workspace]
resolver = "2"
members = [
    "crates/sunmi-core",
    "crates/sunmi-adb",
    "crates/sunmi-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Thiago França da Silva <contact@tfs.dev.br>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["clock"] }
async-channel = "2"
anyhow = "1"

# GPUI published to crates.io (0.2.x); the 0.3 gpui_platform split is not
# published yet. Default features already enable font-kit + wayland + x11.
gpui = "0.2"

sunmi-core = { path = "crates/sunmi-core" }
sunmi-adb = { path = "crates/sunmi-adb" }

# xattr 0.2.3 (dep of zed-async-tar via gpui) references libc::ENOATTR, which
# was removed from newer libc on Linux (ENOATTR == ENODATA there). Vendored
# with that one-line fix.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
