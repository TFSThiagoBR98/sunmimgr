[workspace]
resolver = "2"
members = [
    "crates/sunmi-core",
    "crates/sunmi-adb",
    "crates/sunmi-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Thiago França da Silva <contact@tfs.dev.br>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["clock"] }
anyhow = "1"

sunmi-core = { path = "crates/sunmi-core" }
sunmi-adb = { path = "crates/sunmi-adb" }
